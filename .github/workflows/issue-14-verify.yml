name: issue-14 verification

on:
  push:
    branches:
      - codex/issue-14-behavioral-evals

permissions:
  contents: read

jobs:
  verify-base-failures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 096686144f387f7f47f2f4bb688647ae69417a18
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- test/server.test.ts test/spec-ticket-runtime.test.ts
