name: issue-14 verification

on:
  push:
    branches:
      - codex/issue-14-behavioral-evals

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- test/behavioral-evals.test.ts
