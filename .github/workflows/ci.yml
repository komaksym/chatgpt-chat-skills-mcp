name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test upstream source pins
        run: npx vitest run test/upstream-source.test.ts

      - name: Test projection contract
        run: npx vitest run test/projection.test.ts

      - name: Test corpus audit
        run: npx vitest run test/corpus-quality.test.ts

      - name: Test MCP corpus contract
        run: npx vitest run test/full-corpus-mcp.test.ts

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Prepare corpus size baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            rm -rf "$RUNNER_TEMP/corpus-base"
            mkdir -p "$RUNNER_TEMP/corpus-base"
            git archive "$BASE_SHA" skills | tar -x -C "$RUNNER_TEMP/corpus-base"
            echo "CORPUS_BASELINE_ROOT=$RUNNER_TEMP/corpus-base/skills" >> "$GITHUB_ENV"
          fi

      - name: Verify complete generated corpus
        run: npm run corpus:check
