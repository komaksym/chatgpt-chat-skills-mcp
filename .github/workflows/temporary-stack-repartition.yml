name: temporary-stack-repartition

on:
  push:
    branches:
      - codex/issue-14-behavioral-evals

permissions:
  contents: read
  pull-requests: write

jobs:
  repartition:
    runs-on: ubuntu-latest
    steps:
      - name: Repartition pull request stacks
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headers = { 'X-GitHub-Api-Version': '2026-03-10' };

            const expectedBases = new Map([
              [16, 'main'],
              [25, 'codex/issue-2-handoff-mcp'],
              [17, 'codex/issue-2-handoff-mcp'],
              [18, 'codex/issue-3-catalog-loader'],
              [19, 'codex/issue-4-remote-setup'],
              [21, 'codex/issue-5-grill-domain'],
              [24, 'codex/issue-6-spec-tickets'],
              [23, 'codex/issue-7-code-review'],
              [22, 'codex/issue-8-implement'],
              [26, 'codex/issue-9-architecture-analysis'],
              [28, 'codex/issue-9-architecture-analysis'],
              [27, 'codex/issue-14-release-evals'],
            ]);

            for (const [pr, expectedBase] of expectedBases) {
              const { data } = await github.request('GET /repos/{owner}/{repo}/pulls/{pull_number}', {
                owner, repo, pull_number: pr, headers,
              });
              if (data.base.ref !== expectedBase) {
                throw new Error(`Refusing migration: PR #${pr} base is ${data.base.ref}, expected ${expectedBase}`);
              }
            }

            const original = [16,17,18,19,21,24,23,22,28,27];
            const desired = [
              [16,25],
              [17,18,19,21,24,23,22,26],
              [28,27],
            ];
            const created = [];

            try {
              await github.request('POST /repos/{owner}/{repo}/stacks/{stack_number}/unstack', {
                owner, repo, stack_number: 20, headers,
              });
              core.info('Dissolved stack #20');

              for (const pull_requests of desired) {
                const { data } = await github.request('POST /repos/{owner}/{repo}/stacks', {
                  owner, repo, pull_requests, headers,
                });
                created.push(data.number);
                core.info(`Created stack #${data.number}: ${pull_requests.join(' -> ')}`);
              }
            } catch (error) {
              core.error(`Migration failed: ${error.status ?? ''} ${error.message}`);
              for (const stack_number of created.reverse()) {
                try {
                  await github.request('POST /repos/{owner}/{repo}/stacks/{stack_number}/unstack', {
                    owner, repo, stack_number, headers,
                  });
                } catch (rollbackError) {
                  core.error(`Rollback unstack #${stack_number} failed: ${rollbackError.message}`);
                }
              }
              try {
                const { data } = await github.request('POST /repos/{owner}/{repo}/stacks', {
                  owner, repo, pull_requests: original, headers,
                });
                core.info(`Restored original stack as #${data.number}`);
              } catch (restoreError) {
                core.error(`CRITICAL: restoring original stack failed: ${restoreError.message}`);
              }
              throw error;
            }
