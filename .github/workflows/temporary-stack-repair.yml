name: temporary-stack-repair

on:
  push:
    branches:
      - codex/issue-14-behavioral-evals

permissions:
  contents: read
  pull-requests: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Create stack objects for leaf PRs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            for (const pr of [25, 26, 29]) {
              const current = await github.request('GET /repos/{owner}/{repo}/pulls/{pull_number}', {
                owner, repo, pull_number: pr,
                headers: { 'X-GitHub-Api-Version': '2026-03-10' },
              });
              if (current.data.stack) {
                core.info(`PR #${pr} already in stack #${current.data.stack.number}`);
                continue;
              }
              try {
                const created = await github.request('POST /repos/{owner}/{repo}/stacks', {
                  owner, repo,
                  pull_requests: [pr],
                  headers: { 'X-GitHub-Api-Version': '2026-03-10' },
                });
                core.info(`PR #${pr} -> stack #${created.data.number}`);
              } catch (error) {
                core.warning(`PR #${pr}: ${error.status ?? ''} ${error.message}`);
              }
            }
